<title>تحدي تعلّم الأساسيات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Layout: a single centered "circuit board" game console; stages light up like chips along a trace */
:root{
  --bg:#eef5f2; --board:#ffffff; --ink:#12302b; --muted:#56706a;
  --trace:#c9ddd6; --chip:#0f5c50; --chip-ink:#ffffff;
  --copper:#c2702a; --chip-soft:#d3ebe3; --copper-soft:#fbeadb;
  --ok:#1f8a4c; --ok-soft:#dcf3e5; --bad:#c23a3a; --bad-soft:#fbe1e1;
  --sel:#2563a8; --sel-soft:#dde9f7;
  --photo:#ffffff;
  --display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1c19; --board:#122a26; --ink:#e6f2ee; --muted:#93b0a9;
  --trace:#24443e; --chip:#2fa08c; --chip-ink:#06201b;
  --copper:#e7954f; --chip-soft:#1d423b; --copper-soft:#3a2716;
  --ok:#4cc37f; --ok-soft:#163a27; --bad:#ef6b6b; --bad-soft:#3d1c1c;
  --sel:#6aa6ec; --sel-soft:#1a2f49; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1c19; --board:#122a26; --ink:#e6f2ee; --muted:#93b0a9;
  --trace:#24443e; --chip:#2fa08c; --chip-ink:#06201b;
  --copper:#e7954f; --chip-soft:#1d423b; --copper-soft:#3a2716;
  --ok:#4cc37f; --ok-soft:#163a27; --bad:#ef6b6b; --bad-soft:#3d1c1c;
  --sel:#6aa6ec; --sel-soft:#1a2f49; color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
  background-image:linear-gradient(var(--trace) 1px,transparent 1px),linear-gradient(90deg,var(--trace) 1px,transparent 1px);
  background-size:44px 44px;background-position:center}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
.board{background:var(--board);border:2px solid var(--trace);border-radius:18px;padding:clamp(18px,4vw,34px);
  box-shadow:0 10px 30px -18px rgba(0,0,0,.35)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:800}
h2{font-size:clamp(1.4rem,4vw,1.9rem);font-weight:800}
.eyebrow{color:var(--copper);font-weight:700;font-size:.9rem;letter-spacing:.02em}
.muted{color:var(--muted)}
button{font-family:var(--body);font-size:1rem;cursor:pointer;border:none;color:inherit;background:none}
button:focus-visible{outline:3px solid var(--sel);outline-offset:3px}
.btn{background:var(--chip);color:var(--chip-ink);font-weight:700;padding:14px 28px;border-radius:12px;font-size:1.15rem;
  transition:transform .12s, filter .12s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--trace)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* top bar */
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score{font-family:var(--display);font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}
.score b{color:var(--copper)}
.iconbtn{border:2px solid var(--trace);background:var(--board);border-radius:10px;padding:6px 12px;font-weight:700}

/* stage chips */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative}
.chipst{border:2px solid var(--trace);border-radius:12px;padding:10px 12px;background:var(--board);display:flex;flex-direction:column;gap:2px;min-width:0}
.chipst .n{font-family:var(--display);font-weight:800;font-size:1.05rem}
.chipst small{color:var(--muted);font-variant-numeric:tabular-nums}
.chipst.on{border-color:var(--chip);box-shadow:0 0 0 3px color-mix(in srgb,var(--chip) 25%,transparent)}
.chipst.done{background:var(--ok-soft);border-color:var(--ok)}

/* progress + timer */
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:4px;background:var(--trace)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.cur{background:var(--copper)}
.timer{display:flex;align-items:center;gap:8px;font-weight:700}
.tbar{width:120px;height:10px;border-radius:6px;background:var(--trace);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--copper);transition:width .25s linear}
.timer.low .tbar i{background:var(--bad)} .timer.low{color:var(--bad)}

.q{font-size:clamp(1.25rem,3.6vw,1.6rem);font-weight:700;margin:6px 0 18px;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:center;text-align:start;padding:16px;border-radius:14px;border:2px solid var(--trace);
  background:var(--board);font-size:1.12rem;font-weight:500;transition:border-color .15s,background .15s,transform .1s;min-width:0}
.opt:hover:not(:disabled){border-color:var(--chip)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt .k{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--copper-soft);color:var(--copper);
  font-family:var(--display);font-weight:800;font-size:1.15rem}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok);color:var(--board)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:var(--board)}
.opt.dim{opacity:.55}
.tf .opt{justify-content:center;font-size:1.4rem;font-family:var(--display);font-weight:800;padding:22px}

.fb{margin-top:16px;padding:14px 16px;border-radius:12px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.fb.ok{background:var(--ok-soft);color:var(--ink);border:2px solid var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--ink);border:2px solid var(--bad)}
.fb strong{font-family:var(--display);font-size:1.2rem}
.fb.ok strong{color:var(--ok)} .fb.bad strong{color:var(--bad)}
.fb p{margin:2px 0 0;min-width:0;flex:1 1 260px}

/* matching */
.match{display:grid;grid-template-columns:1fr 1.4fr;gap:14px}
@media (max-width:560px){.match{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.col h3{font-size:1.05rem;color:var(--muted)}
.mi{padding:12px 14px;border-radius:12px;border:2px solid var(--trace);background:var(--board);text-align:start;font-size:1.02rem;display:flex;gap:10px;align-items:center;min-width:0}
.mi:hover:not(:disabled){border-color:var(--chip)}
.mi .k{flex:none;min-width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--copper-soft);color:var(--copper);font-family:var(--display);font-weight:800}
.mi.sel{border-color:var(--sel);background:var(--sel-soft)}
.mi.paired{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.mi.miss{border-color:var(--copper);background:var(--copper-soft);cursor:default}
.mi.shake{animation:shake .35s}
.mi .tag{margin-inline-start:auto;font-weight:700;color:var(--ok);font-family:var(--display)}
.mi.miss .tag{color:var(--copper)}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(3px)}}

/* start + end */
.hero{display:flex;flex-direction:column;gap:14px}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0}
@media (max-width:560px){.plan{grid-template-columns:1fr}}
.plan div{border:2px dashed var(--trace);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.plan b{font-family:var(--display);font-size:1.15rem}
.toggle{display:flex;gap:8px;align-items:center;font-weight:500}
.toggle input{width:20px;height:20px;accent-color:var(--chip)}
.big{font-family:var(--display);font-weight:800;font-size:clamp(3rem,12vw,5.5rem);line-height:1;font-variant-numeric:tabular-nums}
.big span{color:var(--muted);font-size:.45em}
.stars{font-size:2.6rem;letter-spacing:6px;color:var(--copper)}
.stars .off{color:var(--trace)}
.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.breakdown{grid-template-columns:1fr}}
.breakdown div{border:2px solid var(--trace);border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.review li{padding:10px 12px;border-radius:10px;background:var(--bad-soft);border-inline-start:5px solid var(--bad)}
.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}

/* illustrations */
.qwrap{display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:20px;align-items:center;margin:6px 0 18px}
.qwrap .q{margin:0}
@media (max-width:560px){.qwrap{grid-template-columns:1fr;gap:10px}.art{max-width:200px;justify-self:center}}
.art{margin:0;background:var(--bg);border:2px solid var(--trace);border-radius:16px;padding:10px;aspect-ratio:4/3;max-width:100%}
.art svg,.mi svg,.art img,.mi .ic img{width:100%;height:100%;display:block;object-fit:contain}
.art{background:var(--photo)}
.mi .ic{background:var(--photo);border-radius:8px;padding:2px}
.mi .ic{flex:none;width:46px;height:35px}
.s{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.sa{fill:none;stroke:var(--copper);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.f1{fill:var(--chip-soft)} .f2{fill:var(--copper-soft)} .fa{fill:var(--copper)} .fc{fill:var(--chip)} .fb0{fill:var(--board)}
.pop .art{animation:pop .45s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="hud">
    <div class="score">النقاط: <b id="score">٠</b> / ٢١</div>
    <div class="row">
      <button class="iconbtn" id="sound" aria-pressed="true">الصوت: يعمل</button>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <main class="board" id="screen"></main>
</div>

<script>
const STAGES=[
 {name:"صح أم خطأ؟",type:"tf",time:20,items:[
  {q:"يحتوي الحاسب المحمول على بطارية داخلية تساعد على استخدامه في أماكن مختلفة.",a:true,why:"البطارية تتيح تشغيل الحاسب المحمول بعيدًا عن الكهرباء."},
  {q:"تُستخدم شاشة اللمس لعرض المعلومات فقط، ولا يمكن إدخال البيانات من خلالها.",a:false,why:"شاشة اللمس تعرض المعلومات، ونُدخل البيانات من خلالها باللمس أيضًا."},
  {q:"تنفّذ وحدة المعالجة المركزية العمليات التي تساعد الحاسب على أداء مهامه.",a:true,why:"وحدة المعالجة المركزية هي «عقل الحاسب»."},
  {q:"يُعدّ الميكروفون من أجهزة إخراج الصوت من الحاسب.",a:false,why:"الميكروفون جهاز إدخال للصوت، أما مكبرات الصوت فهي للإخراج."},
  {q:"تنتج الطابعة ثلاثية الأبعاد مجسّمات حقيقية يمكن لمسها.",a:true,why:"الطابعة ثلاثية الأبعاد تصنع نماذج ومجسّمات حقيقية."},
  {q:"يؤدي حذف اختصار الملف من سطح المكتب إلى حذف الملف الأصلي.",a:false,why:"الاختصار طريق سريع للملف فقط، وحذفه لا يحذف الملف الأصلي."},
  {q:"يمكن استعادة ملف من سلة المحذوفات ما دام موجودًا فيها ولم يُحذف نهائيًا.",a:true,why:"ما دام الملف في سلة المحذوفات يمكن استعادته إلى مكانه."}
 ]},
 {name:"اختيار من متعدد",type:"mcq",time:30,items:[
  {q:"أي أجهزة الحاسب الآتية يُدخل المستخدم البيانات إليها باللمس، ولا تحتوي عادةً على لوحة مفاتيح؟",o:["الحاسب المكتبي","الحاسب اللوحي","الحاسب المحمول","مشغّل ألعاب الفيديو"],a:1},
  {q:"ما الأداة التي تُستخدم بدلًا من الفأرة لتحريك المؤشر في كثير من أجهزة الحاسب المحمولة؟",o:["لوحة اللمس","الميكروفون","مكبرات الصوت","الماسح الضوئي"],a:0},
  {q:"ما الجزء الذي يُوصف بأنه «عقل الحاسب» لأنه ينفّذ العمليات؟",o:["ذاكرة الوصول العشوائي","القرص الصلب","اللوحة الأم","وحدة المعالجة المركزية"],a:3},
  {q:"ما الجهاز الذي يُستخدم لتحويل صورة أو مستند ورقي إلى ملف في الحاسب؟",o:["الطابعة","الشاشة","الماسح الضوئي","مكبر الصوت"],a:2},
  {q:"ما نوع الطابعة الذي يمكنه إنتاج نماذج ومجسّمات حقيقية؟",o:["الطابعة النافثة للحبر","الطابعة ثلاثية الأبعاد","طابعة الليزر","الطابعة أحادية اللون"],a:1},
  {q:"ما الفائدة الأساسية من ضغط الملفات والمجلدات؟",o:["حذف الملفات تلقائيًا","تغيير أسماء الملفات","تقليل حجمها لتوفير مساحة التخزين","إغلاق جميع البرامج"],a:2},
  {q:"أين يمكن حفظ الملفات عبر الإنترنت لفتحها من أجهزة مختلفة؟",o:["التخزين السحابي","سلة المحذوفات","ذاكرة الوصول العشوائي","اللوحة الأم"],a:0}
 ]},
 {name:"المطابقة",type:"match",time:150,
  terms:["اللوحة الأم","ذاكرة الوصول العشوائي","وحدة الذاكرة الفلاشية","كاميرا الويب","سماعات الرأس","اختصار الملف","استخراج الكل"],
  descs:[["أ","تُستخدم لإجراء مكالمات الفيديو."],["ب","يُستخدم لفك ضغط جميع الملفات الموجودة في مجلد مضغوط."],["ج","يُتيح الوصول السريع إلى الملف دون تغيير مكانه الأصلي."],["د","تربط مكوّنات الحاسب بعضها ببعض لتعمل معًا."],["هـ","تحفظ البيانات التي يحتاجها المعالج لفترة قصيرة."],["و","تُستخدم للاستماع إلى الصوت دون إزعاج الآخرين."],["ز","تُستخدم لحفظ الملفات ونقلها بسهولة، وتمتاز بصغر حجمها."]],
  key:[3,4,6,0,5,2,1]}
];
const LET=["أ","ب","ج","د"];
const pins=(x,y,w,n,dir)=>{let d="";for(let i=0;i<n;i++){const p=(i+1)*w/(n+1);
  d+=dir==="v"?`M${x+p} ${y} v-8 M${x+p} ${y+w} v8 `:`M${x} ${y+p} h-8 M${x+w} ${y+p} h8 `}return d};
const ART={
 laptop:`<rect class="s f1" x="22" y="10" width="76" height="52" rx="4"/><path class="s f2" d="M10 70 h100 l-6 9 h-88 z"/><rect class="s fb0" x="44" y="27" width="28" height="17" rx="2"/><rect class="fa" x="47" y="30" width="17" height="11" rx="1"/><path class="s" d="M75 32 v7"/>`,
 touch:`<rect class="s f1" x="32" y="6" width="56" height="78" rx="8"/><circle class="s" cx="60" cy="44" r="18" style="opacity:.35"/><circle class="s" cx="60" cy="44" r="10"/><circle class="fa" cx="60" cy="44" r="5"/><path class="s" d="M54 76 h12"/>`,
 cpu:`<path class="s" d="${pins(35,20,50,4,'v')}${pins(35,20,50,4,'h')}"/><rect class="s f1" x="35" y="20" width="50" height="50" rx="4"/><rect class="fc" x="47" y="32" width="26" height="26" rx="3"/><circle class="fb0" cx="53" cy="38" r="2"/>`,
 mic:`<rect class="s f2" x="48" y="8" width="24" height="44" rx="12"/><path class="s" d="M54 22 h12 M54 30 h12 M54 38 h12"/><path class="s" d="M38 40 a22 22 0 0 0 44 0 M60 62 v14 M46 80 h28"/>`,
 printer3d:`<path class="s" d="M20 78 V10 h80 v68 M20 22 h80"/><path class="s f2" d="M52 22 h16 v10 l-8 8 l-8 -8 z"/><path class="sa" d="M60 42 v4" /><path class="s fa" d="M44 56 L60 48 L76 56 L76 70 L60 77 L44 70 Z"/><path class="s" d="M44 56 L60 63 L76 56 M60 63 V77"/><rect class="s f1" x="14" y="77" width="92" height="7" rx="2"/>`,
 shortcut:`<path class="s f1" d="M40 6 h28 l16 16 v58 h-44 z"/><path class="s" d="M68 6 v16 h16"/><rect class="s f2" x="30" y="50" width="30" height="30" rx="5"/><path class="sa" d="M38 72 c0 -10 6 -13 15 -13 M48 54 l5 5 l-5 5"/>`,
 recycle:`<path class="s f1" d="M36 24 h48 l-5 58 h-38 z"/><path class="s" d="M28 24 h64 M50 24 v-9 h20 v9"/><path class="sa" d="M60 72 v-30 M50 52 l10 -10 l10 10"/>`,
 tablet:`<rect class="s f1" x="20" y="8" width="80" height="74" rx="9"/><rect class="f2" x="28" y="16" width="64" height="58" rx="3"/><rect class="fc" x="36" y="24" width="12" height="12" rx="3"/><rect class="fa" x="54" y="24" width="12" height="12" rx="3"/><rect class="fc" x="72" y="24" width="12" height="12" rx="3"/><rect class="fa" x="36" y="42" width="12" height="12" rx="3"/><rect class="fc" x="54" y="42" width="12" height="12" rx="3"/><circle class="s fb0" cx="72" cy="62" r="7"/>`,
 touchpad:`<path class="s f1" d="M14 30 h92 l8 48 h-108 z"/><path class="s" d="M22 38 h76 M21 44 h78" style="stroke-dasharray:5 4"/><rect class="s f2" x="42" y="52" width="36" height="20" rx="3"/><path class="s fa" d="M88 4 v22 l6 -6 l5 9 l4 -2 l-5 -9 h8 z"/>`,
 scanner:`<path class="s f2" d="M18 46 L28 12 h66 l8 34"/><rect class="s f1" x="10" y="46" width="100" height="30" rx="5"/><rect class="s fb0" x="34" y="26" width="34" height="20"/><path class="s" d="M40 32 h20 M40 38 h14"/><rect class="fa" x="18" y="56" width="84" height="5" rx="2.5"/><circle class="fc" cx="96" cy="68" r="3"/>`,
 zip:`<path class="s f2" d="M18 22 h28 l8 8 h48 v48 h-84 z"/><path class="s" d="M60 30 v48"/><path class="s" d="M55 36 h10 M55 44 h10 M55 52 h10"/><rect class="s fc" x="54" y="58" width="12" height="10" rx="2"/><path class="sa" d="M2 54 h12 M10 49 l5 5 l-5 5 M118 54 h-12 M110 49 l-5 5 l5 5"/>`,

const svgDraw=k=>`<svg viewBox="0 0 120 90" role="img" aria-hidden="true">${ART[k]}</svg>`;
const svg=k=>PH[k]?`<img src="${PH[k]}" alt="" loading="eager">`:svgDraw(k);
STAGES[0].art=["laptop","touch","cpu","mic","printer3d","shortcut","recycle"];
STAGES[1].art=["tablet","touchpad","cpu","scanner","printer3d","zip","cloud"];
STAGES[2].art=["motherboard","ram","usb","webcam","headphones","shortcut","extract"];

const AR=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const $=s=>document.querySelector(s);
const screen=$("#screen");
let S, timerId=null, useTimer=true, soundOn=true, actx=null;

function beep(kind){
  if(!soundOn) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=kind==="ok"?[523,784]:kind==="bad"?[220,165]:kind==="win"?[523,659,784,1046]:[880];
    notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=kind==="bad"?"sawtooth":"triangle";o.frequency.value=f;
      const t=actx.currentTime+i*.12;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.2);});
  }catch(e){}
}
$("#sound").onclick=e=>{soundOn=!soundOn;e.target.textContent="الصوت: "+(soundOn?"يعمل":"متوقف");e.target.setAttribute("aria-pressed",soundOn)};

function fresh(){return {stage:-1,idx:0,score:0,perStage:[0,0,0],results:[[],[],[]],misses:[]}}
function setScore(){$("#score").textContent=AR(S.score)}
function renderChips(){
  $("#chips").innerHTML=STAGES.map((st,i)=>`<div class="chipst ${i===S.stage?'on':''} ${i<S.stage||S.stage===3?'done':''}">
    <span class="eyebrow">المرحلة ${AR(i+1)}</span><span class="n">${st.name}</span><small>${AR(S.perStage[i])} / ٧ نقاط</small></div>`).join("");
}
function stopTimer(){clearInterval(timerId);timerId=null}
function startTimer(sec,onEnd){
  stopTimer(); const el=$("#timer"); if(!useTimer||!el){if(el)el.hidden=true;return}
  let left=sec; const bar=el.querySelector("i"),txt=el.querySelector("span");
  const draw=()=>{bar.style.width=(left/sec*100)+"%";txt.textContent=AR(left)+" ث";el.classList.toggle("low",left<=5)};
  draw(); timerId=setInterval(()=>{left--;draw();if(left<=5&&left>0)beep("tick");if(left<=0){stopTimer();onEnd()}},1000);
}

function startScreen(){
  S=fresh(); setScore(); renderChips(); stopTimer();
  screen.innerHTML=`<div class="hero pop">
    <span class="eyebrow">مهارات رقمية • الوحدة الأولى</span>
    <h1>تحدي تعلّم الأساسيات</h1>
    <p class="muted" style="margin:0">٢١ سؤالًا في ثلاث مراحل. كل إجابة صحيحة = نقطة واحدة.</p>
    <div class="plan">
      <div><b>١. صح أم خطأ؟</b><span class="muted">٧ عبارات • ٢٠ ثانية لكل عبارة</span></div>
      <div><b>٢. اختيار من متعدد</b><span class="muted">٧ أسئلة • ٣٠ ثانية لكل سؤال</span></div>
      <div><b>٣. المطابقة</b><span class="muted">٧ أزواج • دقيقتان ونصف للمرحلة</span></div>
    </div>
    <label class="toggle" for="useTimer"><input type="checkbox" id="useTimer" ${useTimer?'checked':''}> تشغيل المؤقّت</label>
    <div class="row"><button class="btn" id="go">ابدأ التحدي</button></div>
  </div>`;
  $("#useTimer").onchange=e=>useTimer=e.target.checked;
  $("#go").onclick=()=>{beep("tick");nextStage()};
}

function nextStage(){
  S.stage++; S.idx=0; renderChips();
  if(S.stage>=STAGES.length) return endScreen();
  const st=STAGES[S.stage];
  st.type==="match"?renderMatch():renderQ();
}
function metaHTML(st){
  const dots=Array.from({length:7},(_,i)=>{const r=S.results[S.stage][i];return `<span class="dot ${r===true?'ok':r===false?'bad':i===S.idx?'cur':''}"></span>`}).join("");
  return `<div class="meta"><div class="dots" aria-label="التقدم">${dots}</div>
   <div class="timer" id="timer"><span></span><div class="tbar"><i></i></div></div></div>`;
}
function renderQ(){
  const st=STAGES[S.stage], it=st.items[S.idx];
  const opts= st.type==="tf"
    ? `<div class="opts tf"><button class="opt" data-v="1">✓ صح</button><button class="opt" data-v="0">✗ خطأ</button></div>`
    : `<div class="opts">${it.o.map((t,i)=>`<button class="opt" data-v="${i}"><span class="k">${LET[i]}</span><span>${t}</span></button>`).join("")}</div>`;
  screen.innerHTML=`<div class="pop">${metaHTML(st)}
    <span class="eyebrow">${st.name} • ${AR(S.idx+1)} من ٧</span>
    <div class="qwrap"><figure class="art">${svg(st.art[S.idx])}</figure><p class="q">${it.q}</p></div>${opts}<div id="fb"></div></div>`;
  screen.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.v));
  startTimer(st.time,()=>answer(null));
}
function answer(v){
  stopTimer();
  const st=STAGES[S.stage], it=st.items[S.idx];
  const correctV= st.type==="tf" ? (it.a?1:0) : it.a;
  const ok= v===correctV;
  S.results[S.stage][S.idx]=ok;
  if(ok){S.score++;S.perStage[S.stage]++;setScore();renderChips();beep("ok")}
  else{beep("bad");S.misses.push(st.type==="tf"?`${it.q} ← ${it.a?"صح":"خطأ"}`:`${it.q} ← ${it.o[it.a]}`)}
  screen.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const bv=+b.dataset.v;
    if(bv===correctV)b.classList.add("right");else if(bv===v)b.classList.add("wrong");else b.classList.add("dim")});
  const ans= st.type==="tf" ? (it.a?"صح":"خطأ") : `${LET[it.a]}) ${it.o[it.a]}`;
  const head= ok?"إجابة صحيحة! +١": v===null?"انتهى الوقت":"إجابة خاطئة";
  const body= st.type==="tf" ? `${ok?"":"الإجابة الصحيحة: "+ans+". "}${it.why}` : (ok?"أحسنت.":`الإجابة الصحيحة: ${ans}`);
  const last=S.idx===6;
  $("#fb").innerHTML=`<div class="fb ${ok?'ok':'bad'} pop"><p><strong>${head}</strong><br>${body}</p>
    <button class="btn" id="next">${last?"المرحلة التالية":"التالي"}</button></div>`;
  // refresh dots
  const dots=screen.querySelectorAll(".dot"); dots[S.idx].className="dot "+(ok?"ok":"bad");
  const nb=$("#next"); nb.focus();
  nb.onclick=()=>{ if(last) nextStage(); else {S.idx++;renderQ()} };
}

function renderMatch(){
  const st=STAGES[2];
  const M={selT:null,paired:{},wrongFor:{},done:0};
  screen.innerHTML=`<div class="pop">
    <div class="meta"><span class="eyebrow">المطابقة • اختر مصطلحًا ثم الوصف المناسب له</span>
      <div class="timer" id="timer"><span></span><div class="tbar"><i></i></div></div></div>
    <p class="muted" style="margin:0 0 12px">المحاولة الأولى الصحيحة لكل مصطلح تمنحك نقطة. الخطأ يُظهر الإجابة ولا يمنح نقطة.</p>
    <div class="match">
      <div class="col"><h3>العمود (أ): المصطلحات</h3>
        ${st.terms.map((t,i)=>`<button class="mi" data-t="${i}"><span class="k">${AR(i+1)}</span><span class="ic">${svg(st.art[i])}</span><span>${t}</span><span class="tag"></span></button>`).join("")}</div>
      <div class="col"><h3>العمود (ب): الأوصاف</h3>
        ${st.descs.map((d,i)=>`<button class="mi" data-d="${i}"><span class="k">${d[0]}</span><span>${d[1]}</span></button>`).join("")}</div>
    </div><div id="fb"></div></div>`;
  const tBtns=[...screen.querySelectorAll("[data-t]")], dBtns=[...screen.querySelectorAll("[data-d]")];
  const lock=(ti,good)=>{
    const di=st.key[ti]; M.paired[ti]=true; M.done++;
    tBtns[ti].className="mi "+(good?"paired":"miss"); tBtns[ti].disabled=true;
    tBtns[ti].querySelector(".tag").textContent=st.descs[di][0];
    dBtns[di].className="mi "+(good?"paired":"miss"); dBtns[di].disabled=true;
    S.results[2][ti]=good;
    if(good){S.score++;S.perStage[2]++;setScore();renderChips()}
    else S.misses.push(`${st.terms[ti]} ← ${st.descs[di][1]}`);
    if(M.done===7) finish();
  };
  const finish=()=>{stopTimer();
    $("#fb").innerHTML=`<div class="fb ${S.perStage[2]>=5?'ok':'bad'} pop"><p><strong>انتهت المطابقة</strong><br>حصلت على ${AR(S.perStage[2])} من ٧ في هذه المرحلة.</p>
      <button class="btn" id="next">عرض النتيجة</button></div>`;
    $("#next").focus(); $("#next").onclick=nextStage;};
  tBtns.forEach(b=>b.onclick=()=>{const i=+b.dataset.t;if(M.paired[i])return;
    tBtns.forEach(x=>x.classList.remove("sel"));M.selT=i;b.classList.add("sel");beep("tick")});
  dBtns.forEach(b=>b.onclick=()=>{
    if(M.selT===null){tBtns.forEach(x=>{if(!x.disabled){x.classList.remove("shake");void x.offsetWidth;x.classList.add("shake")}});return}
    const ti=M.selT, di=+b.dataset.d; M.selT=null; tBtns[ti].classList.remove("sel");
    if(st.key[ti]===di){beep("ok");lock(ti,true)}
    else{beep("bad");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");lock(ti,false)}
  });
  startTimer(st.time,()=>{st.terms.forEach((_,i)=>{if(!M.paired[i])lock(i,false)})});
}

function endScreen(){
  stopTimer(); renderChips(); beep("win");
  const s=S.score, stars=s>=19?3:s>=14?2:s>=8?1:0;
  const msg=s===21?"علامة كاملة! أنت خبير في أساسيات الحاسب.":s>=17?"ممتاز! أداء رائع.":s>=12?"جيد جدًا، راجع الأخطاء لتصل للعلامة الكاملة.":"بداية جيدة، راجع الوحدة وحاول مرة أخرى.";
  screen.innerHTML=`<div class="hero pop">
    <span class="eyebrow">النتيجة النهائية</span>
    <div class="big">${AR(s)}<span> / ٢١</span></div>
    <div class="stars" aria-label="${stars} نجوم">${[0,1,2].map(i=>`<span class="${i<stars?'':'off'}">★</span>`).join("")}</div>
    <h2>${msg}</h2>
    <div class="breakdown">${STAGES.map((st,i)=>`<div><span>${st.name}</span><b>${AR(S.perStage[i])} / ٧</b></div>`).join("")}</div>
    ${S.misses.length?`<h3>راجع هذه الإجابات الصحيحة</h3><ul class="review">${S.misses.map(m=>`<li>${m}</li>`).join("")}</ul>`:""}
    <div class="row"><button class="btn" id="again">العب مرة أخرى</button></div>
  </div>`;
  $("#again").onclick=startScreen;
}
startScreen();
</script>
